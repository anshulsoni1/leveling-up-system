<div class="system-wrapper">
  <div class="content-container">
    <div class="header-section">
      <button class="back-btn glow-hover" routerLink="/system">« BACK TO SYSTEM</button>
      <h1 class="page-title system-glitch" *ngIf="module()">
        <span class="module-icon">{{ module()?.icon }}</span>
        {{ module()?.name | uppercase }}
      </h1>
      <p class="system-desc" *ngIf="module()">CATEGORY: {{ module()?.category | uppercase }} | MODE: {{ module()?.trackingType | uppercase }} | XP: {{ module()?.xp || 0 }}</p>
    </div>

    <!-- Controls -->
    <div class="controls-panel">
      <button class="log-btn primary-glow" (click)="logActivity()">++ LOG ACTIVITY ++</button>
    </div>


    <!-- Stats Board -->
    <div class="stats-panel" style="display: flex; gap: 1rem; margin-bottom: 2rem;">
      <div class="hud-panel stat-box" style="flex: 1; padding: 1.5rem; text-align: center;">
        <h3 class="system-dim" style="font-size: 0.9rem; letter-spacing: 2px; margin-bottom: 0.5rem;">CURRENT STREAK</h3>
        <div class="system-glitch" style="font-size: 3rem; color: var(--system-cyan)">{{ currentStreak() }}</div>
      </div>
      <div class="hud-panel stat-box" style="flex: 1; padding: 1.5rem; text-align: center;">
        <h3 class="system-dim" style="font-size: 0.9rem; letter-spacing: 2px; margin-bottom: 0.5rem;">LONGEST STREAK</h3>
        <div class="system-value" style="font-size: 3rem; color: var(--system-light)">{{ longestStreak() }}</div>
      </div>
    </div>

    <!-- Heatmap Native View -->
    <div class="heatmap-container" style="margin-bottom: 2rem;">
      <app-module-heatmap [heatmapData]="heatmapData()"></app-module-heatmap>
    </div>

    <!-- History Panel -->
    <app-module-log-viewer [moduleId]="moduleId"></app-module-log-viewer>
  </div>
</div>
