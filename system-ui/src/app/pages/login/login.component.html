<div class='login-overlay'>
  <app-glitch-text text='PLAYER DETECTED' [speed]='0.6' [enableShadows]='true' [enableOnHover]='false' class='system-status glitch-strong'></app-glitch-text>

  <div class='login-content'>
    <div class='hero'>
      <h1 class='sys-title has-energy-sweep' style='text-shadow: 0 0 10px rgba(0, 150, 255, 0.6), 0 0 20px rgba(0, 150, 255, 0.3)'>S O L O - L E V E L I N G</h1>
      <h2 class='sys-subtitle'>A W A K E N</h2>
      
      <div class='auth-box hud-panel'>
        <div class='hud-header'>
          <div class='hud-title'>{{ isLoginMode ? 'SYSTEM LOGIN' : 'PLAYER REGISTRATION' }}</div>
          <div class='hud-decoration'></div>
        </div>
        
        <form (ngSubmit)='onSubmit()' class='auth-form'>
          <div class='form-group'>
            <label class='sys-label'>EMAIL</label>
            <input type='email' [(ngModel)]='email' name='email' class='sys-input' required>
          </div>
          <div class='form-group'>
            <label class='sys-label'>PASSWORD</label>
            <input type='password' [(ngModel)]='password' name='password' class='sys-input' required>
          </div>
          
          <div *ngIf='error' class='error-msg'>{{ error }}</div>
          
          <div class='actions'>
            <button type='submit' class='sys-btn primary interactive-btn' [disabled]='isLoading'>
              {{ isLoading ? 'Processing...' : (isLoginMode ? 'Login' : 'Signup') }}
            </button>
            <button type='button' class='sys-btn text-btn' (click)='toggleMode()'>
              {{ isLoginMode ? 'Register New Player' : 'Already Awoken?' }}
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
